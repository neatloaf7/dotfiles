#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = uwsm app waybar -u waybar.scope
exec-once = [workspace 6] uwsm app vesktop -u vesktop.scope
exec-once = uwsm app udiskie -u udiskie.scope
exec-once = uwsm app xremap ~/.config/xremap/config.yml

