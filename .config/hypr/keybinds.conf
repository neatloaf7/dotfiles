# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, X, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, uwsm stop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, B, layoutmsg, togglesplit# dwindle
bind = $mainMod, B, layoutmsg, promote# dwindle
bind = $mainMod, I, exec, uwsm-app firefox

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, hyprctl dispatch workspace r~1
bind = $mainMod, 2, exec, hyprctl dispatch workspace r~2
bind = $mainMod, 3, exec, hyprctl dispatch workspace r~3
bind = $mainMod, 4, exec, hyprctl dispatch workspace r~4
bind = $mainMod, 5, exec, hyprctl dispatch workspace r~5
bind = $mainMod, 6, exec, hyprctl dispatch workspace r~6
bind = $mainMod, 7, exec, hyprctl dispatch workspace r~7
bind = $mainMod, 8, exec, hyprctl dispatch workspace r~8
bind = $mainMod, 9, exec, hyprctl dispatch workspace r~9
bind = $mainMod, 0, exec, hyprctl dispatch workspace r~10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, hyprctl dispatch movetoworkspace r~1
bind = $mainMod SHIFT, 2, exec, hyprctl dispatch movetoworkspace r~2 
bind = $mainMod SHIFT, 3, exec, hyprctl dispatch movetoworkspace r~3
bind = $mainMod SHIFT, 4, exec, hyprctl dispatch movetoworkspace r~4
bind = $mainMod SHIFT, 5, exec, hyprctl dispatch movetoworkspace r~5

# Example special workspace (scratchpad)
bind = $mainMod, G, togglespecialworkspace, games
bind = $mainMod, S, togglespecialworkspace, vm
bind = $mainMod SHIFT, G, movetoworkspace, special:games 
bind = $mainMod SHIFT, S, movetoworkspace, special:vm

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
#bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#wpctl binds
bind = SHIFT, F3, exec, ~/.config/hypr/scripts/toggle_audio.sh

#scrolling
bind = $mainMod, mouse_up, layoutmsg, move +col
bind = $mainMod, mouse_down, layoutmsg, move -col

#prtscrn, shift+prt to save to ~/pictures
bind = ,Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m region
